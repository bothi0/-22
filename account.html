<main class="page-container">


<div class="page-heading">

<span>
بيانات الحاج
</span>

<h1>
الملف الشخصي
</h1>

<p>
يمكنك تعديل بياناتك الشخصية وحفظها.
</p>

</div>



<div class="profile-card">


<div class="profile-header">

<div class="profile-avatar">
ح
</div>

<div>

<h2>
بيانات الحاج
</h2>

<p>
معلوماتك محفوظة بشكل آمن.
</p>

</div>

</div>



<form id="profileForm">


<div class="form-grid">


<div>

<label>
الاسم
</label>

<input
type="text"
name="name"
placeholder="الاسم الكامل"
required
>

</div>



<div>

<label>
العمر
</label>

<input
type="number"
name="age"
placeholder="العمر"
>

</div>



<div>

<label>
الحالة الاجتماعية
</label>

<select name="marital">

<option>
أعزب / عزباء
</option>

<option>
متزوج / متزوجة
</option>

<option>
مطلق / مطلقة
</option>

<option>
أرمل / أرملة
</option>

</select>

</div>



<div>

<label>
المدينة
</label>

<input
type="text"
name="city"
placeholder="المدينة"
>

</div>



<div>

<label>
رقم الهوية
</label>

<input
type="text"
name="nationalId"
placeholder="رقم الهوية"
>

</div>



<div>

<label>
رقم الجوال
</label>

<input
type="tel"
name="phone"
placeholder="05xxxxxxxx"
>

</div>



<div>

<label>
البريد الإلكتروني
</label>

<input
type="email"
name="email"
placeholder="name@example.com"
>

</div>



<div>

<label>
اسم المشرف
</label>

<input
type="text"
name="supervisor"
value="عبدالرحمن الحربي"
>

</div>



<div class="full-field">

<label>
هل توجد أمراض مزمنة؟
</label>

<textarea
name="chronic"
rows="4"
placeholder="اكتب إن وجد أو اكتب لا يوجد"></textarea>

</div>


</div>



<button class="main-button"
type="submit">

حفظ التعديلات

</button>


</form>

</div>


</main>


<script src="js/app.js"></script>
